name: Release

# Pushing a version tag (v0.1.0) builds a standalone executable on each OS and attaches them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple silicon
          - os: macos-15-intel
          - os: windows-latest
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        if: matrix.os == 'ubuntu-latest'
      - run: npm run build:sea
      - name: Package
        shell: bash
        run: |
          cd build/sea
          for f in reinvent-match-*; do
            case "$f" in
              *.exe) 7z a "${f%.exe}.zip" "$f" >/dev/null ;;
              *) tar -czf "$f.tar.gz" "$f" ;;
            esac
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: sea-${{ matrix.os }}
          path: |
            build/sea/*.tar.gz
            build/sea/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Reinvent:Match $TAG" --notes "Standalone builds: download the one for your system, unzip, run. No Node needed. With Node 20+, \`npx reinvent-match\` works too. Builds are not code-signed: see the README for opening them on macOS and Windows."
